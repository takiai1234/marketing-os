# =============================================================================
# Marketing OS — Nginx site configuration
#
# BEFORE USING: replace every occurrence of ${DOMAIN} with your actual domain,
# e.g.: sed -i 's/${DOMAIN}/marketing.example.com/g' nginx/sites/marketing-os.conf
#
# SSL certificates are managed by Certbot / Let's Encrypt.
# Run the first-issuance procedure in scripts/setup-vps.md before starting
# the full stack.
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP — only serves ACME challenges; everything else redirects to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # Certbot webroot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — SSL termination + reverse proxy to Next.js app
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};

    # ------------------------------------------------------------------
    # SSL — certificates issued by Certbot (Let's Encrypt)
    # ------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # ------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            DENY                                           always;
    add_header X-Content-Type-Options     nosniff                                        always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;

    # ------------------------------------------------------------------
    # Proxy defaults (applied to all proxy_pass locations)
    # ------------------------------------------------------------------
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Upgrade           $http_upgrade;
    proxy_set_header    Connection        "upgrade";
    proxy_read_timeout  60s;
    proxy_send_timeout  60s;

    # ------------------------------------------------------------------
    # Static assets — cache 1 year (Next.js content-hashes filenames)
    # ------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ------------------------------------------------------------------
    # Public folder static files
    # ------------------------------------------------------------------
    location /favicon.ico {
        proxy_pass http://app;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ------------------------------------------------------------------
    # Login endpoint — rate limited: 5 requests/min per IP
    # ------------------------------------------------------------------
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://app;
    }

    # ------------------------------------------------------------------
    # FB Ads ingest — Chrome extension đẩy ad node JSON về.
    # Nâng giới hạn body (mặc định Nginx chỉ 1MB) để batch ad lớn không bị
    # chặn → tránh 502/413. Route tự xác thực bằng bearer token.
    # ------------------------------------------------------------------
    location /api/news/ingest-ads {
        client_max_body_size 25m;
        proxy_pass http://app;
    }

    # ------------------------------------------------------------------
    # Everything else — proxy to Next.js app
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://app;
    }
}
