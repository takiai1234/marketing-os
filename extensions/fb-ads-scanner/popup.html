<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --fg: #18181b;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #2563eb;
        --accent-fg: #fff;
        --ok: #16a34a;
        --err: #dc2626;
      }
      * { box-sizing: border-box; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        width: 320px;
        margin: 0;
        padding: 14px;
        color: var(--fg);
        background: #fff;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 2px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      p.sub { font-size: 11px; color: var(--muted); margin: 0 0 12px; }
      label { font-size: 11px; font-weight: 600; display: block; margin: 10px 0 4px; }
      input {
        width: 100%;
        font-size: 12px;
        padding: 7px 8px;
        border: 1px solid var(--border);
        border-radius: 7px;
        outline: none;
      }
      input:focus { border-color: var(--accent); }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button {
        flex: 1;
        font-size: 13px;
        font-weight: 600;
        padding: 9px 10px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      button.primary { background: var(--accent); color: var(--accent-fg); }
      button.primary:disabled { opacity: 0.55; cursor: default; }
      button.ghost { background: #f4f4f5; color: var(--fg); flex: 0 0 auto; }
      #status {
        font-size: 11.5px;
        margin-top: 10px;
        padding: 8px;
        border-radius: 7px;
        background: #f4f4f5;
        white-space: pre-wrap;
        line-height: 1.4;
      }
      #status.ok { color: var(--ok); background: #f0fdf4; }
      #status.err { color: var(--err); background: #fef2f2; }
      .hint { font-size: 10.5px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <h1>📡 FB Ads → Marketing OS</h1>
    <p class="sub">Quét Facebook Ads Library và đẩy về Tin tức AI.</p>

    <label for="siteUrl">Website URL</label>
    <input id="siteUrl" type="url" placeholder="https://marketing-os.cua-ban.com" />

    <label for="token">Ingest token (ADS_INGEST_TOKEN)</label>
    <input id="token" type="password" placeholder="dán token đã set trên server" />

    <div class="row">
      <button id="scan" class="primary">Scan &amp; đẩy</button>
      <button id="save" class="ghost">Lưu</button>
    </div>

    <div id="status">Chưa quét.</div>

    <p class="hint">
      Mở
      <a href="https://www.facebook.com/ads/library/" target="_blank" rel="noopener"
        >Facebook Ads Library</a
      >, tìm &amp; <b>cuộn để nạp thêm ad</b>, rồi bấm <b>Scan</b>. Extension gom
      ad bạn đã cuộn qua và đẩy về website.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
